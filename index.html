  <h1>Wejdź do biura.</h1>
  <form id="unlock">
    <label for="password">Hasło dostępu</label>
    <input id="password" type="password" autocomplete="current-password" required autofocus>
    <button id="submit" type="submit">Otwórz podgląd</button>
    <p id="error" role="alert" aria-live="polite"></p>
  </form>
  <p class="note">Podgląd zawiera listę B2B z Excela i dane do ćwiczeń. Zapamiętuje ustawienie widoku na tym urządzeniu. Wpisane wyniki i zmiany zadań pozostają w bieżącej karcie.</p>
  <footer>Zawartość podglądu jest zaszyfrowana.</footer>
</main>
<script>
  const config={"salt":"Yfz/PQETInp0bvVa+ooXUg==","iv":"Avf3BOMQ6snERqu3","iterations":600000,"payload":"office.enc"};
  const form=document.getElementById('unlock'),field=document.getElementById('password'),button=document.getElementById('submit'),error=document.getElementById('error');
  const bytes=text=>Uint8Array.from(atob(text),char=>char.charCodeAt(0));
  form.addEventListener('submit',async event=>{
    event.preventDefault();if(button.disabled)return;button.disabled=true;error.textContent='';button.textContent='Otwieranie…';
    let phase='network';
    try{
      if(!crypto.subtle||!window.DecompressionStream)throw new Error('browser');
      const response=await fetch(new URL(config.payload,location.href),{cache:'no-store',credentials:'omit'});
      if(!response.ok)throw new Error('network');
      const encrypted=await response.arrayBuffer();phase='password';
      const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(field.value),'PBKDF2',false,['deriveKey']);field.value='';
      const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(config.salt),iterations:config.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
      const packed=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(config.iv)},key,encrypted);phase='content';
      const stream=new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'));
      const html=await new Response(stream).text();
      // Credentials and decrypted records stay in memory. The app stores display preferences only.
      document.open();document.write(html);document.close();
    }catch(exception){
      field.value='';button.disabled=false;button.textContent='Otwórz podgląd';
      error.textContent=exception.message==='browser'?'Otwórz podgląd w aktualnym Chrome, Safari, Edge lub Firefox.':phase==='password'?'Nieprawidłowe hasło lub uszkodzony plik podglądu.':phase==='network'?'Nie udało się pobrać podglądu. Sprawdź połączenie i spróbuj ponownie.':'Nie udało się otworzyć podglądu.';
      field.focus();
    }
  });
</script>
